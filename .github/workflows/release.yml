name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb-arm64:
    name: Build .deb (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Add cross-compilation apt sources
        run: |
          sudo dpkg --add-architecture arm64
          # Pin existing sources to amd64 so apt doesn't look for arm64 on the Ubuntu mirrors.
          # Third-party lists (e.g. microsoft-prod.list) already carry [options]; drop them, we don't need them.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo sed -i '/^deb \[/! s/^deb /deb [arch=amd64] /' /etc/apt/sources.list.d/*.list /etc/apt/sources.list 2>/dev/null || true
          for f in /etc/apt/sources.list.d/*.sources; do
            if [ -e "$f" ] && ! grep -q '^Architectures:' "$f"; then
              sudo sed -i '/^Types:/a Architectures: amd64' "$f"
            fi
          done
          echo "deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/cross-arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/cross-arm64.list
          sudo apt-get update

      - name: Install cross-compilation dependencies
        run: sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev:arm64

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build .deb
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
        run: cargo deb --target aarch64-unknown-linux-gnu

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: neowax-arm64.deb
          path: target/aarch64-unknown-linux-gnu/debian/*.deb

  build-appimage-x86_64:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64

      - name: Build release binary
        run: cargo build --release

      - name: Download appimagetool
        run: |
          curl -sLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/neowax-ui AppDir/usr/bin/
          cp assets/neowax.desktop AppDir/neowax.desktop
          cp assets/neowax-256.png AppDir/usr/share/icons/hicolor/256x256/apps/neowax.png
          cp assets/neowax-256.png AppDir/neowax.png

          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/neowax-ui" "$@"
          APPRUN
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: ARCH=x86_64 ./appimagetool AppDir neowax-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: neowax-x86_64.AppImage
          path: neowax-x86_64.AppImage

  release:
    name: Create Release
    needs: [build-deb-arm64, build-appimage-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
