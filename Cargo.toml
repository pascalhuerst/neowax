[package]
name = "neowax"
version = "0.1.1"
edition = "2021"
description = "Vinyl timecode DJ player"

[dependencies]
lazy_static = "1.4.0"
egui = "0.24.1"
eframe = "0.24.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
alsa = "0.9.1"
anyhow = "1.0.97"
libc = "0.2.171"
ringbuf = "0.4.8"
symphonia = { version = "0.5.3", features = ["mp3", "wav", "flac", "aac", "isomp4", "ogg", "vorbis", "aiff", "pcm"] }
num-traits = "0.2.19"
byteorder = "1.5.0"
clap = { version = "4.5.1", features = ["derive"] }
ctrlc = "3.4"
id3 = "1.8.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[[bin]]
name = "neowax-ui"
path = "src/bin/neowax_ui.rs"

[package.metadata.deb]
maintainer = "Pascal Huerst"
extended-description = "Plays digital audio files in sync with a vinyl timecode record (Serato 2A) through ALSA."
license-file = ["LICENSE", "0"]
depends = "libasound2, libc6, cage, sudo, adduser, systemd"
maintainer-scripts = "debian/"
# Enabled and started on first install. Never stopped or restarted on upgrade:
# the in-app updater runs dpkg from inside the service and restarts itself.
systemd-units = { unit-scripts = "assets/systemd", enable = true, start = true, restart-after-upgrade = false, stop-on-upgrade = false }
section = "sound"
priority = "optional"
assets = [
    ["assets/neowax-install-update", "usr/lib/neowax/install-update", "755"],
    ["assets/neowax.sudoers", "etc/sudoers.d/neowax", "440"],
    ["assets/neowax.default", "etc/default/neowax", "644"],
    ["assets/99-neowax-usb-automount.rules", "usr/lib/udev/rules.d/99-neowax-usb-automount.rules", "644"],
    ["target/release/neowax-ui", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/neowax/", "644"],
    ["assets/neowax.desktop", "usr/share/applications/", "644"],
    ["assets/neowax-16.png", "usr/share/icons/hicolor/16x16/apps/neowax.png", "644"],
    ["assets/neowax-32.png", "usr/share/icons/hicolor/32x32/apps/neowax.png", "644"],
    ["assets/neowax-48.png", "usr/share/icons/hicolor/48x48/apps/neowax.png", "644"],
    ["assets/neowax-64.png", "usr/share/icons/hicolor/64x64/apps/neowax.png", "644"],
    ["assets/neowax-128.png", "usr/share/icons/hicolor/128x128/apps/neowax.png", "644"],
    ["assets/neowax-256.png", "usr/share/icons/hicolor/256x256/apps/neowax.png", "644"],
    ["assets/neowax-512.png", "usr/share/icons/hicolor/512x512/apps/neowax.png", "644"],
    ["assets/neowax.svg", "usr/share/icons/hicolor/scalable/apps/neowax.svg", "644"],
]
