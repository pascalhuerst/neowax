<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="vinyl-sheen" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="label-grad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#7b241c"/>
    </radialGradient>
    <radialGradient id="hole-grad" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
  </defs>

  <!-- Vinyl body -->
  <circle cx="256" cy="256" r="250" fill="url(#vinyl-sheen)" stroke="#111" stroke-width="4"/>

  <!-- Grooves - outer region -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#1f1f1f" stroke-width="0.6" opacity="0.7"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#222" stroke-width="0.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#1e1e1e" stroke-width="0.6" opacity="0.7"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#222" stroke-width="0.5" opacity="0.5"/>
  <circle cx="256" cy="256" r="208" fill="none" stroke="#1f1f1f" stroke-width="0.6" opacity="0.7"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#222" stroke-width="0.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#1e1e1e" stroke-width="0.6" opacity="0.7"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="#222" stroke-width="0.5" opacity="0.5"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#1f1f1f" stroke-width="0.6" opacity="0.7"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#222" stroke-width="0.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e1e1e" stroke-width="0.6" opacity="0.7"/>
  <circle cx="256" cy="256" r="152" fill="none" stroke="#222" stroke-width="0.5" opacity="0.5"/>
  <circle cx="256" cy="256" r="144" fill="none" stroke="#1f1f1f" stroke-width="0.6" opacity="0.7"/>
  <circle cx="256" cy="256" r="136" fill="none" stroke="#222" stroke-width="0.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="#1e1e1e" stroke-width="0.6" opacity="0.7"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#222" stroke-width="0.5" opacity="0.5"/>

  <!-- Light reflection arc on vinyl -->
  <path d="M 140 140 A 180 180 0 0 1 372 140" fill="none" stroke="#333" stroke-width="1.5" opacity="0.3"/>

  <!-- Label -->
  <circle cx="256" cy="256" r="100" fill="url(#label-grad)"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#5a1a14" stroke-width="1.5"/>

  <!-- Label ring decoration -->
  <circle cx="256" cy="256" r="92" fill="none" stroke="#9b2c24" stroke-width="0.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="88" fill="none" stroke="#a83229" stroke-width="0.3" opacity="0.4"/>

  <!-- Label text: neowax -->
  <text x="256" y="248" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="3" fill="#f0e0d0">neowax</text>

  <!-- Subtitle -->
  <text x="256" y="275" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" letter-spacing="5" fill="#d4a89a" text-transform="uppercase">DIGITAL VINYL</text>

  <!-- Center hole -->
  <circle cx="256" cy="256" r="12" fill="url(#hole-grad)"/>
  <circle cx="256" cy="256" r="12" fill="none" stroke="#444" stroke-width="1"/>
  <circle cx="256" cy="256" r="10" fill="none" stroke="#222" stroke-width="0.5"/>
</svg>
